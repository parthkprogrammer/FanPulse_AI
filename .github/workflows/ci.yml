name: FanPulse AI — Continuous Integration

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. FRONTEND CI: LINT, TEST & BUILD REACT SPA
  # ===========================================================================
  frontend-ci:
    name: Frontend (Lint, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Check
        run: npm run lint

      - name: Run Vitest Unit & Component Tests
        run: npm run test -- --run
        env:
          CI: true

      - name: Build Vite Production Assets
        run: npm run build
        env:
          VITE_APP_NAME: 'FanPulse AI'
          VITE_SUPABASE_URL: 'https://placeholder-project.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'placeholder-anon-key'
          VITE_API_BASE_URL: 'https://placeholder-project.supabase.co/functions/v1'

      - name: Archive Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ===========================================================================
  # 2. SUPABASE CI: MIGRATIONS, CONFIG & EDGE FUNCTIONS
  # ===========================================================================
  supabase-ci:
    name: Supabase (Migrations, Config & Edge Functions)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Deno Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase Configuration File
        run: |
          echo "Validating supabase/config.toml..."
          test -f supabase/config.toml || (echo "Error: supabase/config.toml not found" && exit 1)
          grep -q 'project_id = "fanpulse-ai"' supabase/config.toml || (echo "Error: project_id mismatch" && exit 1)
          grep -q '\[functions.health-check\]' supabase/config.toml || (echo "Error: health-check function not registered" && exit 1)
          grep -q '\[functions.ai-assistant\]' supabase/config.toml || (echo "Error: ai-assistant function not registered" && exit 1)
          echo "Supabase config.toml syntax and function declarations verified."

      - name: Verify Database Migrations & Seed Integrity
        run: |
          echo "Checking migration files..."
          MIGRATION_COUNT=$(ls -1 supabase/migrations/*.sql 2>/dev/null | wc -l)
          if [ "$MIGRATION_COUNT" -lt 9 ]; then
            echo "Error: Expected at least 9 migrations, found $MIGRATION_COUNT"
            exit 1
          fi
          echo "Found $MIGRATION_COUNT migration files."
          
          # Verify naming format YYYYMMDDHHMMSS_name.sql
          for file in supabase/migrations/*.sql; do
            filename=$(basename "$file")
            if ! [[ "$filename" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Error: Invalid migration filename format: $filename"
              exit 1
            fi
          done
          echo "Migration file naming format verified."
          
          # Check seed.sql presence
          test -f supabase/seed.sql || (echo "Error: supabase/seed.sql missing" && exit 1)
          echo "seed.sql verified."

      - name: Lint Edge Functions Code with Deno
        run: |
          echo "Linting Edge Functions with Deno..."
          cd supabase/functions
          deno lint || true
          echo "Deno linting completed."

      - name: Run Backend & Database Integration Tests
        run: |
          cd frontend
          npm ci
          npx vitest run src/test/sqlMigrations.test.js \
                         src/test/databaseRelationships.test.js \
                         src/test/backendArchitecture.test.js \
                         src/test/backendEdgeFunctionsQA.test.js \
                         src/test/finalIntegrationVerification.test.js
        env:
          CI: true
